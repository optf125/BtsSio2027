<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription Nouveau Client</title>
</head>
<body><header><h1>Inscription d'un Nouveau client</h1></header>
	<section>
<form action="4" method="post"><table width=”70%” border="0">
 <TR> <td> <label for="nom">Nom :</label> </td>  <td> 	<input type="text" id="nom" name="nom"> </TD>  </tr>
	<tr><td><label for="prenom">Prénom :</label></td><td><input type="text" id="prenom" name="prenom"></td></tr>
	<br>
	<tr><td><label for="date naissance">Date de naissance :</label></td><td><input type="date" id="date naissance" name="date naissance"></td></tr>
	<br>
	<tr><td><label for="mail">Adress mail :</label></td>
	<td><input type="email" id="mail" name="mail"></tr>
	<br>
	<tr><td><label for="mdp">Mot de passe :</label></td>
	<td><input type="password" id="mdp" name="mdp"></td></tr>
	<br>
	<tr><td><label for="permis">Numéro de permis :</label></td>
	<td><input type="text" id="permis" name="permis"></td></tr>
	<br>
	<tr><td><label for="ancien">Nombre d'années d'ancienneté :</label></td>
	<td><input type="number" id="ancien" name="ancien" min="0" max="50"></td></tr>
	<br>
	<tr><td><label for="ville">Ville :</label></td>
	<td><select id="ville" name="ville">
		<option value="paris">Paris</option>
		<option value="versaille">Versaille</option>
		<option value="creteil">Créteil</option>
	</select></td></tr>
	<br>
	<tr><td><label for="adress">Adress du client :</label></td>
	<td><textarea id="adress" name="adress"rows="4"cols="30"></textarea></td></tr>
	<br>
	<tr><td><p>Situation matrimoniale :</p></td>
	<td><label for="marie_oui" >Marie</label>
	<input type="radio" id="marie_oui"name="marie" value="oui">
	<br>
	<label for="marie_non" >Non Marie</label>
	<input type="radio" id="marie_non"name="marie" value="non"></td></tr>
	<br>
	<tr><td><p>Preférence de voiture :</p></td>
	<td><label for="pref_auto" >Automatique</label>
	<input type="checkbox" id="pref_auto"name="pref_auto" value="automatique">
	<label for="pref_manuelle" >Manuelle</label>
	<input type="checkbox" id="pref_manuelle"name="pref_manuelle" value="manuelle"></td></tr>
	<br>
	<tr><td><button type="submit">Enregistrer</button>
	<button type="reset">Annuler</button></td>
	</tr>
</table>
</form>
<a href="index.html">Retour</a>
</section>
<footer>
	<p>&copy; 2026 Agence Méditerranée - Location de véhicules</p>
</footer>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body><header><h1>Ajout d'un nouveau véhicule</h1></header>
	<section>
<form action="4" method="post"><table width="”60%”" border="0">

	<tr><td><label for="Marque">Marque :</label></td>
	<td><select id="Marque" name="Marque">
		<option value=" Peugeot"> Peugeot</option>
		<option value="Mercedes">Mercedes</option>
		<option value="Renaul">Renaul</option>
	</select></td></tr>
<tbody><tr> <td> <label for="Immatriculation">Immatriculation :</label> </td>  <td> 	<input type="text" id="Immatriculation" name="Immatriculation"> </td>  </tr>
	<tr><td><label for="Couleur">Couleur :</label></td><td><input type="text" id="Couleur" name="Couleur"></td></tr>
	
	<tr><td><label for="Date d'immatriculation">Date d'immatriculation :</label></td><td><input type="date" id="Date d'immatriculation" name="Date d'immatriculation"></td></tr>

	<tr><td><label for="Kilométrage ">Kilométrage  :</label></td>
	<td><input type="number" id="Kilométrage " name="Kilométrage " min="0" max="50"></td></tr>

	<tr><td><p>État :</p></td>
	<td><label for="Occasion">Occasion</label>
	<input type="radio" id="Occasion" name="Occasion" value="oui">
	<br>
	<label for="Neuf">Neuf</label>
	<input type="radio" id="Neuf" name="Neuf" value="non"></td></tr>

	<tr><td><p>Carburant  :</p></td>
	<td><label for="Hybride">Hybride</label>
	<input type="radio" id="Hybride" name="Hybride" value="oui">
	<br>
	<label for="Électrique">Électrique</label>
	<input type="radio" id="Électrique" name="Électrique" value="oui">
	<br>
	<label for="Essence">Essence</label>
	<input type="radio" id="Essence" name="Essence" value="non">
	<br>
	<label for="Diesel">Diesel</label>
	<input type="radio" id="Diesel" name="Diesel" value="non"></td></tr>

	<tr><td><label for="Boîte de vitesses ">Boîte de vitesses  :</label></td><td><input type="text" id="Boîte de vitesses " name="Boîte de vitesses "></td></tr>

	<tr><td><label for="Nombre de porte ">Nombre de portes  :</label></td>
	<td><input type="number" id="Nombre de porte " name="Nombre de porte" min="0" max="10"></td></tr>
	<tr><td><label for="Numero de serie ">Numero de serie  :</label></td>
	<td><input type="text" id="Numero de serie " name="Numero de serie" ></td></tr>

	
	
</tbody></table>
<button type="submit">Enregistrer</button>
	<button type="reset">Annuler</button>
	
</form>

</section>

</html>
